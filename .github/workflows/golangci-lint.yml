on:
  push:
    tags:
    - v*
    branches:
    - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    - uses: golangci/golangci-lint-action@v8
      with:
        version: v2.15.0
        args: --fix=false
